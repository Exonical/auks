name: CI

on:
  push:
  pull_request:

jobs:
  build-slurm-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libkrb5-dev \
            libtirpc-dev \
            flex \
            bison \
            libslurm-dev

      - name: Build
        run: |
          autoreconf -i
          ./configure --with-slurm
          make
          make -C src/plugins/slurm clean
          make -C src/plugins/slurm \
            CFLAGS="-Wall -Wextra -Wformat=2 -Werror"
          rust/golden/regen.sh

  compose-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker compose build

      - name: Start test services
        run: docker compose up -d

      - name: Run integration tests
        run: docker compose exec -T auks_client bats /tests/simple.bats

      - name: Run Slurm integration tests
        run: docker compose exec -T slurm runuser -u user -- bats /tests/slurm.bats

      - name: Stop test services
        if: always()
        run: docker compose down -v

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Kerberos and bindgen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libclang-dev

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Run clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: rust
        run: cargo test
